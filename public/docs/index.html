<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visor TV Enterprise — Documentación API REST (Swagger)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/docs/favicon.svg">
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .custom-header {
      background: linear-gradient(135deg, #090d16 0%, #1e1b4b 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .custom-header .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .custom-header .logo-box {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
    }
    .custom-header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      background: linear-gradient(to right, #ffffff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .custom-header p {
      margin: 0.2rem 0 0;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .custom-header .author-tag {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 0.4rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      color: #60a5fa;
      font-weight: 600;
    }
    /* Dark Theme Overrides for Swagger UI */
    .swagger-ui {
      filter: invert(88%) hue-rotate(180deg);
    }
    .swagger-ui .topbar { display: none; }
    .swagger-ui .info { margin: 2rem 0; }
  </style>
</head>
<body>
  <header class="custom-header">
    <div class="brand">
      <div class="logo-box">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="15" x="2" y="5" rx="3"/>
          <polyline points="17 2 12 5 7 2"/>
        </svg>
      </div>
      <div>
        <h1>Visor TV Enterprise API</h1>
        <p>Documentación Oficial OpenAPI 3.1 & Consola Interactiva</p>
      </div>
    </div>
    <div>
      <span class="author-tag">⚡ Creado por Ashly Nicole</span>
    </div>
  </header>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      SwaggerUIBundle({
        url: "/docs/openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout"
      });
    };
  </script>
</body>
</html>
